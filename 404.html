<head>

<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<style>
@font-face { font-family: 'Instrument Serif'; src: url('/assets/fonts/instrument-serif-regular.woff2') format('woff2'); font-display: swap; }
@font-face { font-family: 'Instrument Serif'; src: url('/assets/fonts/instrument-serif-italic.woff2') format('woff2'); font-style: italic; font-display: swap; }

a { display: inline-block; padding: 14px 26px; border-radius: 999px; background: #1b2a4e; color: #efe9df; text-decoration: none; font-weight: 550; }

</head>
<body>
  <main>
